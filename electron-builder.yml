appId: sh.omp.gui
productName: OMP
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
  - en

files:
  - out/**/*
  - build/icon.png
  - package.json
  - "!node_modules/**"
  - "!**/*.map"
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: default
      arch:
        - arm64
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
